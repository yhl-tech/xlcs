<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>知己心探测试-图版</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/driver.js@1.3.2/dist/driver.min.css"
    />
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/intro-preview-background.css" />
    <link rel="stylesheet" href="./css/waiting-report.css" />
    <link rel="stylesheet" href="./css/question-progress.css" />
  </head>

  <body>
    <!-- 黑洞粒子背景容器 -->
    <div id="blackhole-bg-container"></div>
    <div id="blackhole-loading">正在加载背景...</div>

    <!-- 信息输入屏幕 -->
    <div id="info-screen" class="screen">
      <div class="info-card">
        <h1>🎨 知己心探测试</h1>
        <div class="info-form-group">
          <label for="sex">性别</label>
          <select id="sex" required>
            <option value="男" selected>男</option>
            <option value="女">女</option>
          </select>
          <div
            id="sex-error"
            class="input-error-message"
            role="status"
            aria-live="polite"
          ></div>
        </div>
        <div class="info-form-group">
          <label for="age">年龄</label>
          <input
            type="number"
            id="age"
            placeholder="例如：25"
            min="0"
            step="1"
            inputmode="numeric"
            required
          />
          <div
            id="age-error"
            class="input-error-message"
            role="status"
            aria-live="polite"
          ></div>
        </div>
        <div class="info-form-group">
          <label for="education">学历</label>
          <select id="education" required>
            <option value="小学">小学</option>
            <option value="初中">初中</option>
            <option value="高中">高中</option>
            <option value="中专">中专</option>
            <option value="大专">大专</option>
            <option value="本科">本科</option>
            <option value="硕士">硕士</option>
            <option value="博士">博士</option>
          </select>
          <div
            id="education-error"
            class="input-error-message"
            role="status"
            aria-live="polite"
          ></div>
        </div>
        <div class="info-form-group">
          <label for="occupation">职业</label>
          <input
            type="text"
            id="occupation"
            placeholder="例如：工程师"
            required
          />
          <div
            id="occupation-error"
            class="input-error-message"
            role="status"
            aria-live="polite"
          ></div>
        </div>
        <div class="info-form-group">
          <label for="mood">当前心情</label>
          <input type="text" id="mood" placeholder="例如：平静" required />
          <div
            id="mood-error"
            class="input-error-message"
            role="status"
            aria-live="polite"
          ></div>
        </div>
        <button id="start-test-btn">开始测试</button>
        <button
          id="resume-test-btn"
          style="display: none; margin-top: 12px; background: #0ea5e9"
        >
          恢复未完成测试
        </button>
      </div>
    </div>

    <!-- 主应用窗口 -->
    <div id="app-window" class="app-window screen">
      <div class="title-bar">
        <span class="title-content"><img class="logo" src="./public/images/logo.png" alt="">知己心探</span>
        <div class="title-bar-right">
          <span class="progress-info" id="progress-text">准备中...</span>
          <div class="auth-controls" id="auth-controls" style="display: none">
            <span class="username" id="username-display"></span>
                <!-- <button class="logout-btn" id="test-submit-btn" style="margin-right: 10px; background: #4CAF50;">测试提交</button> -->
            <!-- <button class="logout-btn" id="test-tracks-btn" style="margin-right: 10px; background: #ff9800;">测试轨迹</button>
            <button class="logout-btn" id="direct-enter-btn" style="margin-right: 10px; background: #2196F3;">直接进入</button> -->
             <!-- <button class="logout-btn" id="test-audio-btn" style="margin-right: 10px; background: #4CAF50;">测试音频录制</button> -->
              
            <button class="logout-btn" id="logout-btn">退出</button>
          </div>
          <button class="login-btn" id="login-btn" style="display: none">
            登录
          </button>
        </div>
      </div>

      <div
        id="test-loading-overlay"
        class="test-loading-overlay hidden"
        role="status"
        aria-live="polite"
        aria-hidden="true"
      >
        <div class="test-loading-content">
          <div class="test-loading-spinner" aria-hidden="true"></div>
          <p id="test-loading-text" class="test-loading-text">
            正在准备测试环境，请稍候...
          </p>
          <p class="test-loading-subtext">
            图版加载完成后会自动恢复，请保持页面打开。
          </p>
        </div>
      </div>

      <div class="main-content" id="main-content">
        <div id="welcome-text-container"></div>
        <div id="intro-overlay" style="display: none">
          <div class="intro-preview-layout">
            <div class="intro-preview-panel test-preview-panel">
              <div class="test-preview-window">
                <div class="test-preview-body">
                  <div class="test-preview-image-area">
                    <div class="test-preview-image-frame">
                      <img
                        id="intro-preview-image"
                        src="./images/rorschach-blot-example.webp"
                        alt=""
                      />
                      <canvas class="test-preview-canvas"></canvas>
                    </div>
                  </div>
                  <div class="test-preview-controls">
                    <!-- <div class="control-group">
                      <button disabled data-action="prev">◀ 上一张</button>
                    </div> -->
                    <div class="control-group">
                      <button disabled data-action="zoom-in">🔍+ 放大</button>
                      <button disabled data-action="zoom-out">🔍- 缩小</button>
                      <button disabled data-action="rotate-left">↶ 左转</button>
                      <button disabled data-action="rotate-right">
                        ↷ 右转
                      </button>
                    </div>
                    <div class="control-group">
                      <button disabled class="selected" data-action="pen">
                        ✏️ 画笔
                      </button>
                      <div class="color-selector">
                        <div
                          class="color-option selected"
                          data-color="red"
                          style="background-color: #ef4444"
                        ></div>
                        <div
                          class="color-option"
                          data-color="green"
                          style="background-color: #10b981"
                        ></div>
                        <div
                          class="color-option"
                          data-color="blue"
                          style="background-color: #3b82f6"
                        ></div>
                      </div>
                      <button disabled data-action="erase">🗑️ 擦除</button>
                      <button disabled data-action="clear">🧹 一键擦除</button>
                    </div>
                    <!-- <div class="control-group">
                      <button disabled data-action="next">下一张 ▶</button>
                    </div> -->
                  </div>
                </div>
              </div>
            </div>
            <div class="intro-info-panel">
              <div class="intro-info-header">
                <div class="intro-info-icon">🎧</div>
                <div>
                  <p class="intro-info-label">测试是如何进行的？</p>
                </div>
              </div>
              <div id="intro-text" class="intro-info-text"></div>
              <button
                id="enter-btn"
                class="intro-enter-btn"
                style="display: none"
              >
                进入
              </button>
            </div>
          </div>
        </div>
        <div id="image-container">
          <img id="rorschach-image" src="" alt="" />
          <canvas id="drawing-canvas"></canvas>
        </div>

        <!-- 能量柱 - 画笔绘画进度可视化 -->
        <div id="energy-pillar-container">
          <div id="energy-particles"></div>
          <div id="energy-pillar">
            <div id="energy-pillar-bg"></div>
            <div id="energy-fill">
              <div id="energy-ripple"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="post-test-view" style="display: none">
        <div class="post-test-header">
          <h2>综合测试</h2>
          <button id="next-question-btn" style="display: none">下一页</button>
        </div>
        <p id="question-text"></p>
        <div id="post-test-grid" class="image-grid"></div>
        <div class="finish">
          <button id="finish-btn" style="display: none">提交</button>
        </div>

        <!-- 问题进度柱 -->
        <div id="question-progress-pillar-container">
          <div id="question-progress-particles"></div>
          <div id="question-progress-pillar">
            <div id="question-progress-pillar-bg"></div>
            <div id="question-progress-fill">
              <div id="question-progress-ripple"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="summary-view" style="display: none">
        <!-- <h2>📊 报告生成中</h2> -->
        <!-- <p style="text-align: center; color: #94a3b8; margin-bottom: 3rem; font-size: 1.1rem;">您的测试报告正在处理，请稍候...</p> -->

        <div id="summary-grid" class="image-grid"></div>
      </div>

      <!-- 字幕显示区域 -->
      <div
        id="subtitle-container"
        class="subtitle-container"
        style="display: none"
      >
        <div class="subtitle-content">
          <div class="subtitle-text" id="subtitle-text">
            <span
              class="typing-cursor"
              id="subtitle-indicator"
              style="display: none"
            ></span>
          </div>
        </div>
      </div>

      <div class="controls-bar" id="controls-bar" style="display: none">
        <div class="control-group">
          <button id="prev-btn">◀ 上一张</button>
        </div>
        <div class="control-group">
          <button id="zoom-in-btn">🔍+ 放大</button>
          <button id="zoom-out-btn">🔍- 缩小</button>
          <button id="rotate-left-btn">↶ 左转</button>
          <button id="rotate-right-btn">↷ 右转</button>
        </div>
        <div class="control-group">
          <button id="pen-tool">✏️ 画笔</button>
          <div class="color-selector">
            <div
              class="color-option selected"
              data-color="red"
              style="background-color: #ef4444"
            ></div>
            <div
              class="color-option"
              data-color="green"
              style="background-color: #10b981"
            ></div>
            <div
              class="color-option"
              data-color="blue"
              style="background-color: #3b82f6"
            ></div>
          </div>
          <button id="eraser-tool">🗑️ 擦除</button>
          <button id="clear-all-tool">🧹 一键擦除</button>
        </div>
        <div class="control-group">
          <button id="next-btn">下一张 ▶</button>
        </div>
      </div>
    </div>

    <!-- 等待报告生成视图（移到 app-window 外面，实现全屏铺满）-->
    <div id="waiting-report-view" style="display: none">
      <!-- 星云背景画布 -->
      <!-- <canvas id="nebula-canvas"></canvas> -->

      <!-- 矩阵数字雨画布 -->
      <!-- <canvas id="matrix-canvas"></canvas> -->

      <!-- 词云画布 -->
      <canvas id="wordcloud-canvas"></canvas>

      <!-- 文本粒子汇聚画布 -->
      <canvas id="text-particle-canvas"></canvas>

      <!-- 粒子汇聚画布 -->
      <canvas id="particle-canvas"></canvas>

      <!-- 主容器 -->
      <div class="waiting-report-main-container">
        <!-- 标题区域 -->
        <div class="waiting-report-header">
          <h1>🧠 数据上传 分析中</h1>
          <p class="waiting-report-status-text">正在解析您的心理特征数据</p>
        </div>
      </div>

      <!-- 黑洞圆形进度条 -->
      <div class="waiting-report-progress-container">
        <div class="waiting-report-blackhole">
          <!-- 外层光晕 -->
          <div class="waiting-report-accretion-glow"></div>
          <!-- 吸积盘 -->
          <div class="waiting-report-accretion-disk"></div>
          <!-- 处理指示器 -->
          <div class="waiting-report-processing-indicator"></div>
          <!-- 事件视界 -->
          <div class="waiting-report-blackhole-horizon"></div>
          <!-- 黑洞核心 -->
          <div class="waiting-report-blackhole-core">
            <div class="waiting-report-core-data-stream" id="core-stream"></div>
          </div>
          <!-- 数据计数器 -->
          <div class="waiting-report-data-counter" id="data-counter">0</div>
          <!-- 词云切换容器 -->
          <div
            class="waiting-report-blackhole-words"
            id="blackhole-words"
          ></div>
          <!-- 轨道环 -->
          <div class="waiting-report-orbit-ring"></div>
          <div class="waiting-report-orbit-ring"></div>
          <div class="waiting-report-orbit-ring"></div>
          <!-- 能量波纹 -->
          <div class="waiting-report-energy-wave"></div>
          <div class="waiting-report-energy-wave"></div>
          <div class="waiting-report-energy-wave"></div>
          <div class="waiting-report-energy-wave"></div>
          <!-- 火花容器 -->
          <div
            class="waiting-report-spark-container"
            id="spark-container"
          ></div>
        </div>
        <p class="waiting-report-progress-text">正在整合多维度数据...</p>
      </div>

      <!-- 扫描线 -->
      <div class="waiting-report-scan-line"></div>

      <!-- 数据流线（动态生成） -->
      <div id="data-streams"></div>

      <!-- 底部提示 -->
      <div class="waiting-report-footer-hint">
        <p>请耐心等待，AI 正在为您生成详细报告</p>
        <div class="waiting-report-dots">
          <div class="waiting-report-dot"></div>
          <div class="waiting-report-dot"></div>
          <div class="waiting-report-dot"></div>
        </div>
      </div>
    </div>

    <audio id="audio-player"></audio>

    <!-- 移动端调试工具 vConsole -->
    <script src="https://cdn.jsdelivr.net/npm/vconsole@latest/dist/vconsole.min.js"></script>
    <script>
      // 自动检测移动端并启用 vConsole（仅在非生产环境启用）
      // 通过检查域名来判断是否为生产环境
      const isProduction =
        window.location.hostname !== "localhost" &&
        window.location.hostname !== "127.0.0.1" &&
        !window.location.hostname.startsWith("192.168.") &&
        window.location.protocol === "https:"

      // 仅在非生产环境且满足条件时启用 vConsole
      if (!isProduction) {
        const isMobile =
          /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
            navigator.userAgent
          )
        if (isMobile || window.location.search.includes("debug=true")) {
          if (typeof VConsole !== "undefined") {
            window.vConsole = new VConsole({
              theme: "dark",
              maxLogNumber: 1000,
              onReady: function () {
                console.log("[vConsole] 移动端调试工具已启用")
              },
            })
          }
        }
      }
    </script>

    <!-- Three.js 3D 库 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- 黑洞粒子背景特效 -->
    <script type="module" src="./script/blackHoleBackground.js"></script>

    <!-- 介绍页背景管理 -->
    <!-- <script src="./script/introBackgroundManager.js"></script> -->

    <!-- 能量柱效果 -->
    <script type="module" src="./script/energyPillar.js"></script>

    <!-- Axios 库 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- 配置文件 -->
    <script type="module" src="./script/config.js"></script>

    <!-- API 接口模块 -->
    <script type="module" src="./script/api.js"></script>

    <!-- 认证模块 -->
    <script type="module" src="./script/auth.js"></script>

    <!-- 交互追踪系统 -->
    <script type="module" src="./script/interactionTracker.js"></script>

    <!-- 会话持久化模块 -->
    <script type="module" src="./script/sessionManager.js"></script>

    <!-- lamejs MP3编码库 -->
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

    <!-- 音频录制器 -->
    <script type="module" src="./script/audioRecorder.js"></script>

    <!-- TTS 语音合成客户端 -->
    <script type="module" src="./script/ttsClient.js"></script>

    <!-- 字幕管理器 -->
    <script type="module" src="./script/subtitleManager.js"></script>

    <!-- 等待报告动画管理器 -->
    <script type="module" src="./script/waitingReport.js"></script>

    <!-- 问题进度柱管理 -->
    <script type="module" src="./script/questionProgress.js"></script>

    <!-- 测试按钮事件管理 -->
     <script type="module" src="./script/testButtons.js"></script>

    <!-- Main workflow script (modularized) -->
    <script type="module" src="./script/appMain.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分析报告生成中 - 罗夏墨迹测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
      background: #0a0e27;
      color: #fff;
    }

    /* 星云背景画布 */
    #nebula-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 矩阵数字雨画布 */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.3;
    }

    /* 词云画布 */
    #wordcloud-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* 文本粒子汇聚画布 */
    #text-particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }

    /* 粒子汇聚画布 */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    /* 主容器 */
    .main-container {
      position: relative;
      z-index: 6;
      min-height: 100vh;
      padding: 60px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 标题区域 */
    .header-section {
      text-align: center;
      margin-bottom: 50px;
      animation: fadeInDown 1s ease-out;
    }

    .header-section h1 {
      font-size: 42px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 15px;
      text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
    }

    .status-text {
      font-size: 18px;
      color: #a0aec0;
      letter-spacing: 2px;
    }

    /* 黑洞圆形进度条容器 */
    .progress-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9;
      animation: fadeIn 1.5s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 黑洞主体 */
    .blackhole {
      position: relative;
      width: 200px;
      height: 200px;
    }

    /* 黑洞中心 - 深色核心 */
    .blackhole-core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #0a0e27 0%, #000 50%, #0a0e27 100%);
      border-radius: 50%;
      box-shadow:
        0 0 30px 10px rgba(0, 0, 0, 0.8),
        0 0 60px 20px rgba(10, 14, 39, 0.6),
        inset 0 0 30px rgba(0, 0, 0, 1);
      z-index: 3;
      animation: coreBreath 1.5s ease-in-out infinite;
      overflow: hidden;
    }

    /* 核心内数据流动效果 */
    .core-data-stream {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      font-size: 8px;
      color: rgba(102, 126, 234, 0.6);
      animation: dataFlicker 0.1s linear infinite;
      overflow: hidden;
    }

    /* 能量波纹 */
    .energy-wave {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(102, 126, 234, 0.5);
      animation: waveExpand 2s ease-out infinite;
      pointer-events: none;
    }

    .energy-wave:nth-child(8) {
      animation-delay: 0s;
    }
    .energy-wave:nth-child(9) {
      animation-delay: 0.5s;
    }
    .energy-wave:nth-child(10) {
      animation-delay: 1s;
    }
    .energy-wave:nth-child(11) {
      animation-delay: 1.5s;
    }

    /* 数据计数器 */
    .data-counter {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: rgba(240, 147, 251, 0.8);
      text-shadow: 0 0 10px rgba(240, 147, 251, 0.8);
      z-index: 4;
      white-space: nowrap;
      animation: counterPulse 0.5s ease-in-out infinite;
    }

    /* 黑洞词云切换容器 */
    .blackhole-words {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      height: 160px;
      pointer-events: none;
      z-index: 5;
      overflow: visible;
    }

    /* 词云单词 */
    .flying-word {
      position: absolute;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
      white-space: nowrap;
      opacity: 0;
      transform-origin: center center;
      animation: wordFlyIn 0.6s ease-out forwards;
      text-shadow: 0 0 8px currentColor;
      pointer-events: none;
    }

    /* 词云飞入动画 - 从外向内 */
    @keyframes wordFlyIn {
      0% {
        opacity: 0;
        transform: translate(var(--start-x), var(--start-y)) scale(1.5) rotate(var(--rotate));
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(0, 0) scale(0.3) rotate(0deg);
      }
    }

    /* 词云淡入淡出 */
    @keyframes wordPulse {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }
      20% {
        opacity: 1;
        transform: scale(1.1);
      }
      80% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.8);
      }
    }

    /* 中心词云显示 */
    .center-word {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 10px #667eea, 0 0 20px #764ba2, 0 0 30px #f093fb;
      opacity: 0;
      animation: centerWordShow 0.5s ease-out forwards;
      z-index: 6;
      white-space: nowrap;
    }

    @keyframes centerWordShow {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2);
        filter: blur(10px);
      }
      50% {
        opacity: 1;
        filter: blur(0);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
        filter: blur(5px);
      }
    }

    /* 处理指示器 */
    .processing-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px dashed rgba(102, 126, 234, 0.3);
      animation: indicatorSpin 3s linear infinite;
      z-index: 1;
    }

    /* 数据火花效果容器 */
    .spark-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      pointer-events: none;
      z-index: 2;
    }

    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #f093fb;
      border-radius: 50%;
      box-shadow: 0 0 6px #f093fb, 0 0 12px #667eea;
      animation: sparkFly 1s ease-out infinite;
    }

    @keyframes waveExpand {
      0% {
        width: 60px;
        height: 60px;
        opacity: 0.8;
      }
      100% {
        width: 250px;
        height: 250px;
        opacity: 0;
      }
    }

    @keyframes dataFlicker {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    @keyframes counterPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        text-shadow: 0 0 10px rgba(240, 147, 251, 0.8);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.1);
        text-shadow: 0 0 20px rgba(240, 147, 251, 1), 0 0 30px rgba(102, 126, 234, 0.8);
      }
    }

    @keyframes indicatorSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes sparkFly {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0);
        opacity: 0;
      }
    }

    @keyframes coreBreath {
      0%, 100% {
        box-shadow:
          0 0 30px 10px rgba(0, 0, 0, 0.8),
          0 0 60px 20px rgba(10, 14, 39, 0.6),
          inset 0 0 30px rgba(0, 0, 0, 1);
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        box-shadow:
          0 0 50px 20px rgba(0, 0, 0, 0.9),
          0 0 100px 40px rgba(10, 14, 39, 0.8),
          0 0 150px 60px rgba(102, 126, 234, 0.2),
          inset 0 0 50px rgba(0, 0, 0, 1);
        transform: translate(-50%, -50%) scale(1.05);
      }
    }

    /* 黑洞事件视界 - 发光边缘 */
    .blackhole-horizon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, transparent 40%, rgba(102, 126, 234, 0.1) 60%, rgba(118, 75, 162, 0.2) 80%, transparent 100%);
      box-shadow:
        0 0 20px rgba(102, 126, 234, 0.3),
        0 0 40px rgba(118, 75, 162, 0.2);
      animation: horizonPulse 3s ease-in-out infinite;
      z-index: 2;
    }

    /* 吸积盘 - 外环 */
    .accretion-disk {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px solid transparent;
      background:
        linear-gradient(#0a0e27, #0a0e27) padding-box,
        conic-gradient(from 0deg, #667eea, #764ba2, #f093fb, #667eea) border-box;
      animation: diskRotate 8s linear infinite;
      z-index: 1;
    }

    /* 吸积盘光晕 */
    .accretion-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, transparent 35%, rgba(102, 126, 234, 0.1) 50%, rgba(240, 147, 251, 0.1) 70%, transparent 90%);
      box-shadow:
        0 0 40px rgba(102, 126, 234, 0.3),
        0 0 80px rgba(118, 75, 162, 0.2),
        0 0 120px rgba(240, 147, 251, 0.1);
      animation: glowPulse 2s ease-in-out infinite;
      z-index: 0;
    }

    /* 旋转环 1 */
    .orbit-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid;
      animation: ringRotate 6s linear infinite;
    }

    .orbit-ring:nth-child(5) {
      width: 120px;
      height: 120px;
      border-color: rgba(102, 126, 234, 0.3);
      animation-duration: 4s;
    }

    .orbit-ring:nth-child(6) {
      width: 150px;
      height: 150px;
      border-color: rgba(118, 75, 162, 0.2);
      animation-duration: 6s;
      animation-direction: reverse;
    }

    .orbit-ring:nth-child(7) {
      width: 180px;
      height: 180px;
      border-color: rgba(240, 147, 251, 0.15);
      animation-duration: 8s;
    }

    /* 进度文字 */
    .progress-text {
      margin-top: 30px;
      font-size: 16px;
      color: #e0e0e0;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
      text-align: center;
    }

    /* 黑洞动画 */
    @keyframes diskRotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes ringRotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes horizonPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.8;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.1);
        opacity: 1;
      }
    }

    @keyframes glowPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.6;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.05);
        opacity: 1;
      }
    }

    /* 计算指示器容器 */
    .computation-indicators {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      width: 80%;
      max-width: 800px;
      pointer-events: none;
    }

    /* 扫描线效果 */
    .scan-line {
      position: fixed;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg,
        transparent,
        rgba(102, 126, 234, 0.8),
        transparent);
      box-shadow: 0 0 10px rgba(102, 126, 234, 0.8);
      animation: scanMove 3s linear infinite;
      z-index: 7;
    }

    @keyframes scanMove {
      0% { top: 0; }
      100% { top: 100%; }
    }

    /* 数据流线 */
    .data-stream {
      position: fixed;
      width: 1px;
      height: 100px;
      background: linear-gradient(180deg,
        transparent,
        rgba(240, 147, 251, 0.8),
        transparent);
      animation: dataFlow 2s linear infinite;
      z-index: 7;
    }

    @keyframes dataFlow {
      0% {
        top: -100px;
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        top: 100vh;
        opacity: 0;
      }
    }

    /* 计算百分比显示 - 隐藏，已用进度条替代 */
    .calculation-percentage {
      display: none;
    }

    /* 底部提示 */
    .footer-hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      animation: fadeIn 2s ease-out;
    }

    .footer-hint p {
      color: #a0aec0;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .dots {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #667eea;
      border-radius: 50%;
      animation: dotPulse 1.5s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }

    /* 动画定义 */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    @keyframes pulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.1);
        opacity: 0.8;
      }
    }

    @keyframes dotPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .header-section h1 {
        font-size: 32px;
      }

      .data-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .data-card {
        padding: 20px;
      }

    }
  </style>
</head>
<body>
  <!-- 星云背景画布 -->
  <canvas id="nebula-canvas"></canvas>

  <!-- 矩阵数字雨画布 -->
  <canvas id="matrix-canvas"></canvas>

  <!-- 词云画布 -->
  <canvas id="wordcloud-canvas"></canvas>

  <!-- 文本粒子汇聚画布 -->
  <canvas id="text-particle-canvas"></canvas>

  <!-- 粒子汇聚画布 -->
  <canvas id="particle-canvas"></canvas>

  <!-- 主容器 -->
  <div class="main-container">
    <!-- 标题区域 -->
    <div class="header-section">
      <h1>🧠 AI 深度分析中</h1>
      <p class="status-text">正在解析您的心理特征数据</p>
    </div>
  </div>

  <!-- 黑洞圆形进度条 -->
  <div class="progress-container">
    <div class="blackhole">
      <!-- 外层光晕 -->
      <div class="accretion-glow"></div>
      <!-- 吸积盘 -->
      <div class="accretion-disk"></div>
      <!-- 处理指示器 -->
      <div class="processing-indicator"></div>
      <!-- 事件视界 -->
      <div class="blackhole-horizon"></div>
      <!-- 黑洞核心 -->
      <div class="blackhole-core">
        <div class="core-data-stream" id="core-stream"></div>
      </div>
      <!-- 数据计数器 -->
      <div class="data-counter" id="data-counter">0</div>
      <!-- 词云切换容器 -->
      <div class="blackhole-words" id="blackhole-words"></div>
      <!-- 轨道环 -->
      <div class="orbit-ring"></div>
      <div class="orbit-ring"></div>
      <div class="orbit-ring"></div>
      <!-- 能量波纹 -->
      <div class="energy-wave"></div>
      <div class="energy-wave"></div>
      <div class="energy-wave"></div>
      <div class="energy-wave"></div>
      <!-- 火花容器 -->
      <div class="spark-container" id="spark-container"></div>
    </div>
    <p class="progress-text">正在整合多维度数据...</p>
  </div>

  <!-- 计算百分比显示 -->
  <div class="calculation-percentage" id="calc-percent">0%</div>

  <!-- 扫描线 -->
  <div class="scan-line"></div>

  <!-- 数据流线（动态生成） -->
  <div id="data-streams"></div>

  <!-- 底部提示 -->
  <div class="footer-hint">
    <p>请耐心等待，AI 正在为您生成详细报告</p>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // ==================== 星云背景效果 ====================
    const nebulaCanvas = document.getElementById('nebula-canvas');
    const nebulaCtx = nebulaCanvas.getContext('2d');

    function resizeNebulaCanvas() {
      nebulaCanvas.width = window.innerWidth;
      nebulaCanvas.height = window.innerHeight;
    }
    resizeNebulaCanvas();
    window.addEventListener('resize', resizeNebulaCanvas);

    // 星云粒子
    class NebulaParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * nebulaCanvas.width;
        this.y = Math.random() * nebulaCanvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.5 + 0.2;

        // 随机颜色（紫色/蓝色系）
        const colors = [
          { r: 102, g: 126, b: 234 },  // #667eea
          { r: 118, g: 75, b: 162 },   // #764ba2
          { r: 240, g: 147, b: 251 },  // #f093fb
        ];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        // 边界检测
        if (this.x < 0 || this.x > nebulaCanvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > nebulaCanvas.height) this.speedY *= -1;

        // 闪烁效果
        this.opacity += (Math.random() - 0.5) * 0.02;
        this.opacity = Math.max(0.1, Math.min(0.7, this.opacity));
      }

      draw() {
        nebulaCtx.beginPath();
        nebulaCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        nebulaCtx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity})`;
        nebulaCtx.fill();

        // 光晕效果
        const gradient = nebulaCtx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, this.size * 4
        );
        gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity * 0.5})`);
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

        nebulaCtx.beginPath();
        nebulaCtx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
        nebulaCtx.fillStyle = gradient;
        nebulaCtx.fill();
      }
    }

    // 创建星云粒子
    const nebulaParticles = [];
    for (let i = 0; i < 150; i++) {
      nebulaParticles.push(new NebulaParticle());
    }

        this.targetY = centerY;

        // 计算初始角度（用于旋转路径）
        this.angle = Math.atan2(this.y - centerY, this.x - centerX);

      getColorByType() {
        switch(this.type) {

    function createFlyingWord() {
      const word = document.createElement('div');
      word.className = 'flying-word';
      word.textContent = flyingWords[Math.floor(Math.random() * flyingWords.length)];

      // 随机颜色
      word.style.color = wordColors[Math.floor(Math.random() * wordColors.length)];

      // 随机字体大小
      const fontSize = 10 + Math.random() * 14;
      word.style.fontSize = fontSize + 'px';

      // 随机起始位置（从外围飞入）
      const angle = Math.random() * Math.PI * 2;
      const distance = 80 + Math.random() * 40;
      const startX = Math.cos(angle) * distance;
      const startY = Math.sin(angle) * distance;

      // 设置 CSS 变量
      word.style.setProperty('--start-x', startX + 'px');
      word.style.setProperty('--start-y', startY + 'px');
      word.style.setProperty('--rotate', (Math.random() - 0.5) * 60 + 'deg');

      // 定位到中心
      word.style.left = '50%';
      word.style.top = '50%';
      word.style.transform = 'translate(-50%, -50%)';

      // 随机动画时长 (0.4-0.7秒)
      const duration = 0.4 + Math.random() * 0.3;
      word.style.animationDuration = duration + 's';

      blackholeWords.appendChild(word);

      // 动画结束后移除
      setTimeout(() => word.remove(), duration * 1000);
    }

    // 创建中心闪现的词
    function createCenterWord() {
      const word = document.createElement('div');
      word.className = 'center-word';
      word.textContent = flyingWords[Math.floor(Math.random() * flyingWords.length)];

      // 随机动画时长 (0.4-0.6秒)
      const duration = 0.4 + Math.random() * 0.2;
      word.style.animationDuration = duration + 's';

      blackholeWords.appendChild(word);

      // 动画结束后移除
      setTimeout(() => word.remove(), duration * 1000);
    }

    // 批量创建词云
    function createWordBurst() {
      // 创建 3-5 个飞入的词
      const count = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < count; i++) {
        setTimeout(() => createFlyingWord(), i * 50);
      }

      // 偶尔显示中心词
      if (Math.random() > 0.6) {
        setTimeout(createCenterWord, 100);
      }
    }

    // 快速切换词云 (每 200-400ms)
    function scheduleWordBurst() {
      createWordBurst();
      const nextDelay = 200 + Math.random() * 200;
      setTimeout(scheduleWordBurst, nextDelay);
    }

    // 启动词云动画
    setTimeout(scheduleWordBurst, 1000);

    // ==================== 动态增强效果 ====================
    // 随着词云汇聚，增强动画效果
    let intensityLevel = 1;

    function updateIntensity() {
      // 缓慢增加强度
      intensityLevel = Math.min(3, intensityLevel + 0.005);

      // 更新吸积盘旋转速度
      const disk = document.querySelector('.accretion-disk');
      if (disk) {
        disk.style.animationDuration = (8 / intensityLevel) + 's';
      }

      // 更新能量波速度
      const waves = document.querySelectorAll('.energy-wave');
      waves.forEach((wave, index) => {
        wave.style.animationDuration = (2 / intensityLevel) + 's';
      });

      // 更新处理指示器
      const indicator = document.querySelector('.processing-indicator');
      if (indicator) {
        indicator.style.animationDuration = (3 / intensityLevel) + 's';
      }
    }
    setInterval(updateIntensity, 500);

    // ==================== 响应式处理 ====================
    window.addEventListener('resize', () => {
      resizeNebulaCanvas();
      resizeMatrixCanvas();
      resizeWordcloudCanvas();
      resizeTextParticleCanvas();
      resizeParticleCanvas();
    });
  </script>
</body>
</html>

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 根路径：静态资源 + SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 子路径 /xlcp：静态资源 + SPA 回退（当构建时 VITE_BASE_URL=/xlcp 时使用）
    # 使用 ^~ 避免被下方正则 location (js|css|png...) 抢匹配，否则会找错路径导致 404
    location ^~ /xlcp/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # 可选：将 /api 代理到后端（按需修改 proxy_pass 地址）
    # location /api/ {
    #     proxy_pass http://14.103.237.160:29876/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # 可选：将 /xlcp/api 代理到后端
    # location /xlcp/api/ {
    #     proxy_pass http://14.103.237.160:29876/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # 缓存静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # OpenAI Realtime Token 代理（Python 后端）
    # 前端会请求：
    # - POST /realtime/token
    # - POST /realtime/sdp
    location /realtime/ {
        proxy_pass http://129.226.147.53:8765/realtime/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI 实时语音通话 (带 VAD 优化)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
        }

        .api-key-section {
            margin-bottom: 25px;
        }

        .api-key-section label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .api-key-input-wrapper {
            position: relative;
            display: flex;
            gap: 10px;
        }

        #apiKeyInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        #apiKeyInput:focus {
            border-color: rgba(99, 102, 241, 0.6);
        }

        #apiKeyInput::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .save-key-btn {
            padding: 12px 20px;
            background: rgba(99, 102, 241, 0.3);
            border: 1px solid rgba(99, 102, 241, 0.5);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .save-key-btn:hover {
            background: rgba(99, 102, 241, 0.5);
        }

        .key-status {
            font-size: 12px;
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.5);
        }

        .key-status.saved {
            color: #10b981;
        }

        .status-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .status-item:last-child {
            margin-bottom: 0;
        }

        .status-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .status-value {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #fff;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #6b7280;
        }

        .status-dot.connected {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .status-dot.connecting {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }

        .status-dot.error {
            background: #ef4444;
        }

        .status-dot.active {
            background: #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* VAD 统计面板 */
        .vad-stats {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
        }

        .vad-stats-title {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vad-stats-title .badge {
            background: rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
        }

        .vad-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .vad-stat-item {
            text-align: center;
        }

        .vad-stat-value {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
        }

        .vad-stat-value.savings {
            color: #10b981;
        }

        .vad-stat-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        /* 音量条 */
        .volume-meter {
            margin-top: 12px;
        }

        .volume-meter-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
        }

        .volume-bar-container {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .volume-bar {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6, #8b5cf6);
            border-radius: 4px;
            transition: width 0.05s ease;
            width: 0%;
        }

        .volume-threshold {
            position: absolute;
            top: 0;
            height: 100%;
            width: 2px;
            background: #ef4444;
        }

        /* 频谱显示 */
        .spectrum-container {
            margin-top: 12px;
            height: 40px;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 4px;
        }

        .spectrum-bar {
            flex: 1;
            background: rgba(99, 102, 241, 0.6);
            border-radius: 2px;
            min-height: 2px;
            transition: height 0.05s ease;
        }

        .spectrum-bar.voice-range {
            background: rgba(16, 185, 129, 0.8);
        }

        .visualizer-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
        }

        .visualizer {
            text-align: center;
        }

        .visualizer-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .visualizer-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.15s ease;
            border: 2px solid rgba(99, 102, 241, 0.3);
        }

        .visualizer-circle.active {
            background: rgba(99, 102, 241, 0.4);
            border-color: rgba(99, 102, 241, 0.8);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
            transform: scale(1.05);
        }

        .visualizer-circle.speaking {
            animation: speaking 0.3s ease-in-out infinite alternate;
        }

        .visualizer-circle.filtered {
            border-color: rgba(239, 68, 68, 0.5);
        }

        @keyframes speaking {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .visualizer-circle svg {
            width: 32px;
            height: 32px;
            fill: rgba(255, 255, 255, 0.8);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button svg {
            width: 20px;
            height: 20px;
        }

        #startBtn {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
        }

        #startBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        #stopBtn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        #stopBtn:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* VAD 设置 */
        .vad-settings {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
        }

        .vad-settings-title {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .setting-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-control input[type="range"] {
            width: 100px;
            cursor: pointer;
        }

        .setting-control input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .setting-value {
            color: #fff;
            font-size: 13px;
            min-width: 45px;
            text-align: right;
        }

        .model-select {
            margin-bottom: 20px;
        }

        .model-select label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .model-select select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .model-select select option {
            background: #1a1a2e;
            color: #fff;
        }

        /* 系统提示词区域 */
        .prompt-section {
            margin-bottom: 20px;
        }

        .prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .prompt-header label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .prompt-actions {
            display: flex;
            gap: 8px;
        }

        .prompt-btn {
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            flex: none;
        }

        .prompt-btn:hover {
            background: rgba(99, 102, 241, 0.4);
        }

        .prompt-btn.toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        #systemPrompt {
            width: 100%;
            min-height: 120px;
            max-height: 300px;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 13px;
            line-height: 1.6;
            outline: none;
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.2s, min-height 0.3s;
        }

        #systemPrompt:focus {
            border-color: rgba(99, 102, 241, 0.6);
        }

        #systemPrompt::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        #systemPrompt.collapsed {
            min-height: 0;
            height: 0;
            padding: 0;
            border: none;
            overflow: hidden;
        }

        .prompt-status {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 8px;
        }

        .prompt-status.saved {
            color: #10b981;
        }

        .transcript-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            max-height: 250px;
            overflow-y: auto;
        }

        .transcript-title {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .transcript-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            max-width: 85%;
            word-wrap: break-word;
        }

        .message.user {
            background: rgba(99, 102, 241, 0.3);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.system {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            align-self: center;
            font-size: 12px;
            text-align: center;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            align-self: center;
            font-size: 12px;
            text-align: center;
        }

        .empty-state {
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            font-size: 14px;
            padding: 20px;
        }

        .transcript-container::-webkit-scrollbar {
            width: 6px;
        }

        .transcript-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .transcript-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .collapsible {
            cursor: pointer;
            user-select: none;
        }

        .collapsible::after {
            content: ' ▼';
            font-size: 10px;
        }

        .collapsible.collapsed::after {
            content: ' ▶';
        }

        .collapsible-content {
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapsible-content.collapsed {
            max-height: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ OpenAI 实时语音通话</h1>
        
        <div class="api-key-section">
            <label for="apiKeyInput">OpenAI API Key</label>
            <div class="api-key-input-wrapper">
                <input type="password" id="apiKeyInput" placeholder="sk-..." />
                <button class="save-key-btn" onclick="saveApiKey()">保存</button>
            </div>
            <div id="keyStatus" class="key-status">Key 将保存在浏览器本地</div>
        </div>

        <div class="model-select">
            <label for="modelSelect">选择模型</label>
            <select id="modelSelect">
                <option value="gpt-4o-realtime-preview-2024-12-17">gpt-4o-realtime-preview-2024-12-17</option>
                <option value="gpt-4o-realtime-preview">gpt-4o-realtime-preview</option>
                <option value="gpt-4o-mini-realtime-preview">gpt-4o-mini-realtime-preview (更便宜)</option>
                <option value="gpt-4o-mini-realtime-preview-2024-12-17">gpt-4o-mini-realtime-preview-2024-12-17</option>
            </select>
        </div>

        <!-- 系统提示词设置 -->
        <div class="prompt-section">
            <div class="prompt-header">
                <label for="systemPrompt">🎭 角色设定 (System Prompt)</label>
                <div class="prompt-actions">
                    <button class="prompt-btn" onclick="savePrompt()">💾 保存</button>
                    <button class="prompt-btn" onclick="loadDefaultPrompt()">📋 加载默认</button>
                    <button class="prompt-btn toggle-btn" onclick="togglePromptArea()">收起 ▲</button>
                </div>
            </div>
            <textarea id="systemPrompt" placeholder="输入 AI 的角色设定和行为指令..."></textarea>
            <div class="prompt-status" id="promptStatus">提示词将在下次通话时生效</div>
        </div>
        
        <div class="status-container">
            <div class="status-item">
                <span class="status-label">连接状态</span>
                <span class="status-value">
                    <span id="connectionDot" class="status-dot"></span>
                    <span id="connectionStatus">未连接</span>
                </span>
            </div>
            <div class="status-item">
                <span class="status-label">数据通道</span>
                <span class="status-value">
                    <span id="dataDot" class="status-dot"></span>
                    <span id="dataStatus">未就绪</span>
                </span>
            </div>
            <div class="status-item">
                <span class="status-label">本地 VAD</span>
                <span class="status-value">
                    <span id="vadDot" class="status-dot"></span>
                    <span id="vadStatus">未启用</span>
                </span>
            </div>
        </div>

        <!-- VAD 统计 -->
        <div class="vad-stats">
            <div class="vad-stats-title">
                📊 流量优化统计 
                <span class="badge">省钱模式</span>
            </div>
            <div class="vad-stats-grid">
                <div class="vad-stat-item">
                    <div class="vad-stat-value" id="totalChunks">0</div>
                    <div class="vad-stat-label">总音频块</div>
                </div>
                <div class="vad-stat-item">
                    <div class="vad-stat-value" id="filteredChunks">0</div>
                    <div class="vad-stat-label">已过滤</div>
                </div>
                <div class="vad-stat-item">
                    <div class="vad-stat-value savings" id="savingsPercent">0%</div>
                    <div class="vad-stat-label">节省流量</div>
                </div>
            </div>
            
            <!-- 实时音量条 -->
            <div class="volume-meter">
                <div class="volume-meter-label">
                    <span>音量级别</span>
                    <span id="volumeValue">0 dB</span>
                </div>
                <div class="volume-bar-container">
                    <div class="volume-bar" id="volumeBar"></div>
                    <div class="volume-threshold" id="volumeThreshold" style="left: 15%"></div>
                </div>
            </div>

            <!-- 频谱显示 -->
            <div class="spectrum-container" id="spectrumContainer">
                <!-- 频谱条会动态生成 -->
            </div>
        </div>

        <!-- VAD 设置 -->
        <div class="vad-settings">
            <div class="vad-settings-title collapsible" onclick="toggleSettings(this)">⚙️ VAD 参数设置</div>
            <div class="collapsible-content">
                <div class="setting-row">
                    <span class="setting-label">启用本地 VAD</span>
                    <div class="setting-control">
                        <input type="checkbox" id="vadEnabled" checked onchange="updateVadSettings()">
                    </div>
                </div>
                <div class="setting-row">
                    <span class="setting-label">音量阈值 (dB)</span>
                    <div class="setting-control">
                        <input type="range" id="volumeThresholdInput" min="-60" max="-20" value="-45" onchange="updateVadSettings()">
                        <span class="setting-value" id="volumeThresholdValue">-45</span>
                    </div>
                </div>
                <div class="setting-row">
                    <span class="setting-label">人声频率下限 (Hz)</span>
                    <div class="setting-control">
                        <input type="range" id="voiceMinFreq" min="80" max="300" value="200" onchange="updateVadSettings()">
                        <span class="setting-value" id="voiceMinFreqValue">200</span>
                    </div>
                </div>
                <div class="setting-row">
                    <span class="setting-label">人声频率上限 (Hz)</span>
                    <div class="setting-control">
                        <input type="range" id="voiceMaxFreq" min="2000" max="4000" value="3400" onchange="updateVadSettings()">
                        <span class="setting-value" id="voiceMaxFreqValue">3400</span>
                    </div>
                </div>
                <div class="setting-row">
                    <span class="setting-label">人声能量占比 (%)</span>
                    <div class="setting-control">
                        <input type="range" id="voiceEnergyRatio" min="10" max="80" value="40" onchange="updateVadSettings()">
                        <span class="setting-value" id="voiceEnergyRatioValue">40</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="visualizer-container">
            <div class="visualizer">
                <div class="visualizer-label">你</div>
                <div id="userVisualizer" class="visualizer-circle">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </div>
            </div>
            <div class="visualizer">
                <div class="visualizer-label">AI</div>
                <div id="aiVisualizer" class="visualizer-circle">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" onclick="startCall()">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                开始通话
            </button>
            <button id="stopBtn" onclick="stopCall()" disabled>
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 6h12v12H6z"/>
                </svg>
                结束通话
            </button>

    <script>
        // ==================== VAD (Voice Activity Detection) ====================
        class VoiceActivityDetector {
            constructor(options = {}) {
                // VAD 参数
                this.volumeThreshold = options.volumeThreshold || -45;  // dB
                this.voiceMinFreq = options.voiceMinFreq || 200;        // Hz
                this.voiceMaxFreq = options.voiceMaxFreq || 3400;       // Hz
                this.voiceEnergyRatio = options.voiceEnergyRatio || 0.4; // 人声能量占比阈值
                this.enabled = options.enabled !== false;
                
                // 音频分析
                this.audioContext = null;
                this.analyser = null;
                this.dataArray = null;
                this.frequencyData = null;
                
                // 统计
                this.totalChunks = 0;
                this.filteredChunks = 0;
                
                // 回调
                this.onVoiceStart = options.onVoiceStart || (() => {});
                this.onVoiceEnd = options.onVoiceEnd || (() => {});
                this.onAnalysis = options.onAnalysis || (() => {});
                
                // 状态
                this.isVoiceActive = false;
                this.silenceFrames = 0;
                this.voiceFrames = 0;
                this.minVoiceFrames = 3;      // 最少连续人声帧数
                this.minSilenceFrames = 5;    // 最少连续静音帧数
            }
            
            init(audioContext, sourceNode) {
                this.audioContext = audioContext;
                
                // 创建分析器
                this.analyser = audioContext.createAnalyser();
                this.analyser.fftSize = 2048;
                this.analyser.smoothingTimeConstant = 0.3;
                
                // 连接源
                sourceNode.connect(this.analyser);
                
                // 初始化数据数组
                this.dataArray = new Float32Array(this.analyser.fftSize);
                this.frequencyData = new Uint8Array(this.analyser.frequencyBinCount);
                
                console.log('VAD initialized', {
                    sampleRate: audioContext.sampleRate,
                    fftSize: this.analyser.fftSize,
                    frequencyBinCount: this.analyser.frequencyBinCount
                });
            }
            
            // 计算 RMS 音量 (dB)
            calculateVolume() {
                this.analyser.getFloatTimeDomainData(this.dataArray);
                
                let sum = 0;
                for (let i = 0; i < this.dataArray.length; i++) {
                    sum += this.dataArray[i] * this.dataArray[i];
                }
                const rms = Math.sqrt(sum / this.dataArray.length);
                const db = 20 * Math.log10(rms + 1e-10);
                
                return db;
            }
            
            // 计算人声频段能量占比
            calculateVoiceEnergyRatio() {
                this.analyser.getByteFrequencyData(this.frequencyData);
                
                const sampleRate = this.audioContext.sampleRate;
                const binSize = sampleRate / this.analyser.fftSize;
                
                const voiceMinBin = Math.floor(this.voiceMinFreq / binSize);
                const voiceMaxBin = Math.ceil(this.voiceMaxFreq / binSize);
                
                let totalEnergy = 0;
                let voiceEnergy = 0;
                
                for (let i = 0; i < this.frequencyData.length; i++) {
                    const energy = this.frequencyData[i];
                    totalEnergy += energy;
                    
                    if (i >= voiceMinBin && i <= voiceMaxBin) {
                        voiceEnergy += energy;
                    }
                }
                
                return totalEnergy > 0 ? voiceEnergy / totalEnergy : 0;
            }
            
            // 获取频谱数据（用于可视化）
            getSpectrumData(numBars = 32) {
                this.analyser.getByteFrequencyData(this.frequencyData);
                
                const sampleRate = this.audioContext.sampleRate;
                const binSize = sampleRate / this.analyser.fftSize;
                const voiceMinBin = Math.floor(this.voiceMinFreq / binSize);
                const voiceMaxBin = Math.ceil(this.voiceMaxFreq / binSize);
                
                const step = Math.floor(this.frequencyData.length / numBars);
                const bars = [];
                
                for (let i = 0; i < numBars; i++) {
                    const startBin = i * step;
                    const endBin = Math.min((i + 1) * step, this.frequencyData.length);
                    
                    let sum = 0;
                    for (let j = startBin; j < endBin; j++) {
                        sum += this.frequencyData[j];
                    }
                    const avg = sum / (endBin - startBin);
                    
                    // 判断是否在人声范围
                    const midBin = (startBin + endBin) / 2;
                    const isVoiceRange = midBin >= voiceMinBin && midBin <= voiceMaxBin;
                    
                    bars.push({
                        value: avg / 255,
                        isVoiceRange
                    });
                }
                
                return bars;
            }
            
            // 分析当前帧
            analyze() {
                if (!this.analyser || !this.enabled) {
                    return { isVoice: true, volume: 0, voiceRatio: 0 };
                }
                
                this.totalChunks++;
                
                const volume = this.calculateVolume();
                const voiceRatio = this.calculateVoiceEnergyRatio();
                const spectrum = this.getSpectrumData();
                
                // 判断是否为人声
                const volumeOk = volume > this.volumeThreshold;
                const voiceOk = voiceRatio > this.voiceEnergyRatio;
                const isVoiceFrame = volumeOk && voiceOk;
                
                // 状态机：防抖处理
                let isVoice = this.isVoiceActive;
                
                if (isVoiceFrame) {
                    this.voiceFrames++;
                    this.silenceFrames = 0;
                    
                    if (!this.isVoiceActive && this.voiceFrames >= this.minVoiceFrames) {
                        this.isVoiceActive = true;
                        isVoice = true;
                        this.onVoiceStart();
                    }
                } else {
                    this.silenceFrames++;
                    this.voiceFrames = 0;
                    
                    if (this.isVoiceActive && this.silenceFrames >= this.minSilenceFrames) {
                        this.isVoiceActive = false;
                        isVoice = false;
                        this.onVoiceEnd();
                    }
                }
                
                if (!isVoice) {
                    this.filteredChunks++;
                }
                
                const result = {
                    isVoice,
                    volume,
                    voiceRatio,
                    spectrum,
                    volumeOk,
                    voiceOk,
                    stats: {
                        total: this.totalChunks,
                        filtered: this.filteredChunks,
                        savings: this.totalChunks > 0 
                            ? ((this.filteredChunks / this.totalChunks) * 100).toFixed(1) 
                            : 0
                    }
                };
                
                this.onAnalysis(result);
                
                return result;
            }
            
            resetStats() {
                this.totalChunks = 0;
                this.filteredChunks = 0;
            }
            
            updateSettings(settings) {
                if (settings.volumeThreshold !== undefined) {
                    this.volumeThreshold = settings.volumeThreshold;
                }
                if (settings.voiceMinFreq !== undefined) {
                    this.voiceMinFreq = settings.voiceMinFreq;
                }
                if (settings.voiceMaxFreq !== undefined) {
                    this.voiceMaxFreq = settings.voiceMaxFreq;
                }
                if (settings.voiceEnergyRatio !== undefined) {
                    this.voiceEnergyRatio = settings.voiceEnergyRatio;
                }
                if (settings.enabled !== undefined) {
                    this.enabled = settings.enabled;
                }
            }
        }

# 核心任务
你的唯一目标是严格遵循预设的"罗夏墨迹测试步骤"，提示用户描述图片，听取用户描述，收集用户对墨迹图片的联想、描述、位置和原因，不多做任何引导、评价或解读。

# 完整的施测提问指导语（共10张图片，针对每张图片按下面逻辑执行，循环执行10次）
1. 主动向用户开始测试提示："好的，那我们开始。这是第一张图片。请问可以看到些什么？"（严格按照这句话表述启动测试，不要自定义添加任何词句）
注意点：
  - 此时用户可能会对这个问题产生各种疑问，需要根据下面的文字向用户解释：
    - 用户反问："什么叫看到些什么？"，此时告诉用户："就是从图版中，您可以看出些什么东西出来，没有任何限制。"
    - 用户可能会说："我能看到一团墨迹"，此时应当向用户解释："嗯，我明白您看到了图片上的一团墨迹，但我想问的是，这团墨迹像什么，让您联想到了什么。"
    - 用户可能会说："太抽象了，啥也看不出来"，此时应当向用户解释："嗯，我明白您刚开始看墨迹图片，比较抽象，不太容易看出些什么，不过我相信，您仔细观察一下的话，是可以看出来联想到一些东西的。"
    - 用户可能会说："只需要看出来1个就可以吗？"此时应当解释："不一定，您可以尽力观察，没有任何限制。"
2. **自由联想阶段**，在这个阶段，用户将自由表述自己所看到的东西。【**重要**】：此时不要打断用户说话，延迟几秒钟响应用户，耐心等待用户说完。如果用户在思考，发出"呃……"，"我想一下……"之类的话语，此时严格**保持沉默，不要打断，等待用户思考**。
  - 如果用户有较长时间停顿（30秒钟），此时你可以追问："还能看到些什么吗？"
3. **关键信息追问阶段**：在用户说出图片中像某个东西之后，针对用户的回答进行追问。
  - 如果用户仅仅说了反应，没有做任何阐述，此时，追问用户："请描述一下你看到的XX。"
  - 让用户描述完之后，用户对反应内容的描述，可能是不全的，如果缺失以下信息，则需要追问用户，让他说清楚。
    - 如果用户没有说明【反应区域】，追问用户，"是在图片的哪个部分看出来XX的呢？您可以用画笔按钮，把您看到的圈出来。"
      - 【反应区域】是指用户从哪块墨迹看出来反应内容的。如用户已经描述说出"整体看着像一只XX"(强调了整体墨迹区域)，"这个底下这块白色看着是XX"（强调了部分区域），此时就不再需要追问反应区域了。
    - 如果用户没有说明【反应原因】，需要追问用户："是从哪里看出来像XX的？是因为它的形状、颜色、还是其他什么特征？"
      - 【反应原因】是指用户从什么图片特征看出来反应内容的，主要包括形状、颜色（包括黑白或彩色）、墨迹的浓淡变化、从平面图片看出立体纵深，物品质地和触感，人类（动物、无生命体）的运动行为等，如果用户之前的描述，提及了颜色、形状，或者强调了墨迹色彩的浓淡、空白（白色区域）、立体观察视角、物品的质地和触感、各类的运动行为（如小猫跳跃，火山爆发）等信息，那就不要再追问原因。
  - 如果用户对一个内容描述完毕（用户说出反应，并在追问下说出了区域和原因），需要继续向用户追问："好的，这张图里还能看到一些别的吗？" 重新回到**自由联想阶段**。
  - **切记保持施测语句简短，越短越好，严禁重复用户的描述**
4. **转场提示**：
  - 如果继续追问用户："这张图里还能看到一些别的吗？"，并"再次追问，"确定看不到别的东西了吗？" 用户若明确表示"看不到了"，"没有了"等拒绝信息，那么就告知用户，"好的，如果确定没有了，您可以自行点击页面右下角'下一张'按钮，我们继续看下一张图。"

# 行为准则与交互逻辑
1. 用户优先原则：用户的发言权永远是第一位的。当你在播放语音或说话时，一旦检测到用户开始说话，你必须**立即停止**，并使用"您请说"、"好的，您先说"等话术将话语权交给用户。
2. 【**倾听与等待**】：用户常会思考，发出"呃……"，"我想想……"等类似话语，此时，**必须保持沉默等待，严禁插嘴**，**不要说** 例如"不着急、您慢慢想"，"您可以想好了告诉我" 之类的提示语！
3. **绝对中立**：严禁对用户的回答做出任何正面（如"很好"、"很有趣"）或负面（如"这不太像吧"）的评价。你的反馈应该是事务性的，例如"好的"、"明白了"、"了解"。
4. 程式化执行：你必须严格按照前面定义的【施测提问指导语】进行，不要随意发挥，**极其重要：切记保持施测语句简短，越短越好，严禁重复用户的描述**，不要进行与测试无关的闲聊。
`;

        // 获取临时令牌
        async function getEphemeralToken(apiKey, model) {
            const systemPrompt = getSystemPrompt();
            console.log('Using system prompt:', systemPrompt.substring(0, 100) + '...');
            
            const response = await fetch('https://api.openai.com/v1/realtime/sessions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: model,
                    voice: 'alloy',
                    instructions: systemPrompt,
                    input_audio_transcription: {
                        model: 'whisper-1'
                    },
                    turn_detection: {
                        type: 'server_vad',
                        threshold: 0.5,
                        prefix_padding_ms: 300,
                        silence_duration_ms: 800
                    }
                })
            });

            if (!response.ok) {
                const error = await response.text();
                throw new Error(`获取令牌失败: ${response.status} - ${error}`);
            }

            return await response.json();
        }

        // 开始通话
        async function startCall() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                addMessage('请先输入 API Key', 'error');
                return;
            }

            try {
                startBtn.disabled = true;
                updateConnectionStatus('connecting', '连接中...');
                addMessage('正在建立连接...', 'system');

                // 1. 获取临时令牌
                const model = modelSelect.value;
                addMessage(`使用模型: ${model}`, 'system');
                
                const session = await getEphemeralToken(apiKey, model);
                console.log('Session created:', session);
                
                const ephemeralKey = session.client_secret.value;
                addMessage('已获取临时令牌', 'system');

                // 2. 获取麦克风权限
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 24000
                    } 
                });
                addMessage('麦克风已启用', 'system');

                // 3. 初始化 VAD
                audioContext = new AudioContext({ sampleRate: 24000 });
                const sourceNode = audioContext.createMediaStreamSource(mediaStream);
                
                const vadSettings = {
                    enabled: document.getElementById('vadEnabled').checked,
                    volumeThreshold: parseInt(document.getElementById('volumeThresholdInput').value),
                    voiceMinFreq: parseInt(document.getElementById('voiceMinFreq').value),
                    voiceMaxFreq: parseInt(document.getElementById('voiceMaxFreq').value),
                    voiceEnergyRatio: parseInt(document.getElementById('voiceEnergyRatio').value) / 100,
                    onVoiceStart: () => {
                        console.log('Voice started');
                        userVisualizer.classList.add('speaking');
                    },
                    onVoiceEnd: () => {
                        console.log('Voice ended');
                        userVisualizer.classList.remove('speaking');
                    },
                    onAnalysis: updateVadDisplay
                };
                
                vad = new VoiceActivityDetector(vadSettings);
                vad.init(audioContext, sourceNode);
                
                // 启动 VAD 分析循环
                vadInterval = setInterval(() => {
                    if (vad && isConnected) {
                        vad.analyze();
                    }
                }, 100); // 每 100ms 分析一次
                
                updateVadStatus('connected', '已启用');
                addMessage('本地 VAD 已启用，自动过滤空音频', 'system');
                addMessage('🎭 已加载角色设定: ' + getSystemPrompt().substring(0, 50) + '...', 'system');

                // 4. 创建 RTCPeerConnection
                pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                // 5. 设置音频播放
                audioElement = document.createElement('audio');
                audioElement.autoplay = true;
                
                pc.ontrack = (event) => {
                    console.log('Received remote track:', event.track.kind);
                    audioElement.srcObject = event.streams[0];
                };

                // 6. 添加本地音频轨道
                mediaStream.getTracks().forEach(track => {
                    pc.addTrack(track, mediaStream);
                });

                // 7. 创建数据通道
                dc = pc.createDataChannel('oai-events');
                setupDataChannel();

                // 8. 创建 SDP offer
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // 9. 发送 SDP 到 OpenAI
                const baseUrl = 'https://api.openai.com/v1/realtime';
                const sdpResponse = await fetch(`${baseUrl}?model=${model}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${ephemeralKey}`,
                        'Content-Type': 'application/sdp'
                    },
                    body: offer.sdp
                });

                if (!sdpResponse.ok) {
                    const error = await sdpResponse.text();
                    throw new Error(`SDP 交换失败: ${sdpResponse.status} - ${error}`);
                }

                // 10. 设置远程 SDP
                const answerSdp = await sdpResponse.text();
                await pc.setRemoteDescription({
                    type: 'answer',
                    sdp: answerSdp
                });

                isConnected = true;
                stopBtn.disabled = false;
                updateConnectionStatus('connected', '已连接');
                addMessage('🎉 连接成功！开始说话吧', 'system');

            } catch (error) {
                console.error('启动错误:', error);
                updateConnectionStatus('error', '连接失败');
                addMessage('连接失败: ' + error.message, 'error');
                startBtn.disabled = false;
                stopCall();
            }
        }

        // 设置数据通道
        function setupDataChannel() {
            dc.onopen = () => {
                console.log('Data channel opened');
                updateDataStatus('connected', '已就绪');
            };

            dc.onclose = () => {
                console.log('Data channel closed');
                updateDataStatus('', '未就绪');
            };

            dc.onmessage = (event) => {
                handleServerEvent(JSON.parse(event.data));
            };

            dc.onerror = (error) => {
                console.error('Data channel error:', error);
            };
        }

        // 发送事件
        function sendEvent(event) {
            if (dc && dc.readyState === 'open') {
                dc.send(JSON.stringify(event));
            }
        }

        // 处理服务器事件
        function handleServerEvent(event) {
            console.log('Server event:', event.type);

            switch (event.type) {
                case 'session.created':
                    console.log('Session created on server');
                    break;

                case 'session.updated':
                    console.log('Session updated');
                    break;

                case 'input_audio_buffer.speech_started':
                    // 服务端 VAD 检测到语音开始
                    break;

                case 'input_audio_buffer.speech_stopped':
                    // 服务端 VAD 检测到语音结束
                    break;

                case 'conversation.item.input_audio_transcription.completed':
                    if (event.transcript) {
                        addMessage(event.transcript, 'user');
                    }
                    break;

                case 'response.audio_transcript.delta':
                    break;

                case 'response.audio_transcript.done':
                    if (event.transcript) {
                        addMessage(event.transcript, 'assistant');
                    }
                    break;

                case 'response.audio.delta':
                    aiVisualizer.classList.add('active', 'speaking');
                    break;

                case 'response.audio.done':
                    aiVisualizer.classList.remove('speaking');
                    break;

                case 'response.done':
                    aiVisualizer.classList.remove('active', 'speaking');
                    break;

                case 'error':
                    console.error('Server error:', event.error);
                    addMessage('错误: ' + (event.error?.message || JSON.stringify(event.error)), 'error');
                    break;
            }
        }

        // 结束通话
        function stopCall() {
            isConnected = false;

            // 停止 VAD
            if (vadInterval) {
                clearInterval(vadInterval);
                vadInterval = null;
            }
            
            if (vad) {
                // 显示最终统计
                const stats = {
                    total: vad.totalChunks,
                    filtered: vad.filteredChunks,
                    savings: vad.totalChunks > 0 
                        ? ((vad.filteredChunks / vad.totalChunks) * 100).toFixed(1) 
                        : 0
                };
                addMessage(`📊 本次通话统计: 共 ${stats.total} 个音频块，过滤 ${stats.filtered} 个，节省 ${stats.savings}%`, 'system');
                vad = null;
            }

            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            if (dc) {
                dc.close();
                dc = null;
            }

            if (pc) {
                pc.close();
                pc = null;
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            if (audioElement) {
                audioElement.srcObject = null;
                audioElement = null;
            }

            startBtn.disabled = false;
            stopBtn.disabled = true;
            updateConnectionStatus('', '未连接');
            updateDataStatus('', '未就绪');
            updateVadStatus('', '未启用');
            userVisualizer.classList.remove('active', 'speaking', 'filtered');
            aiVisualizer.classList.remove('active', 'speaking');

            addMessage('通话已结束', 'system');
        }

        // 页面关闭时清理
        window.onbeforeunload = function() {
            stopCall();
        };
    </script>
</body>
</html>
